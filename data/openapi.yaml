openapi: 3.0.0
info:
  title: Mock User API
  version: 1.0.0
paths:
  /api/users:
    get:
      summary: 查询用户列表
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
  /api/users/{id}:
    get:
      summary: 查询单个用户
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  schemas:
    User:
      type: object
      required: [id, name, email, age]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        age: { type: integer, minimum: 0 }
    UserList:
      type: object
      required: [code, data]
      properties:
        code: { type: integer }
        data:
          type: object
          required: [page, total, items]
          properties:
            page: { type: integer }
            total: { type: integer }
            items:
              type: array
              items: { $ref: "#/components/schemas/User" }
